# ==============================================================================
# OmniIntel Autonomous Multi-Agent Research & Predictive Intelligence Engine
# Production Docker Compose Multi-Service Orchestration Stack
# ==============================================================================

services:
  omniintel-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: omniintel-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=*
    volumes:
      - omniintel-data:/app/data
      - omniintel-checkpoints:/app/checkpoints
    networks:
      - omniintel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  omniintel-ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: omniintel-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://omniintel-api:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    command: ["python", "-m", "streamlit", "run", "src/ui/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      omniintel-api:
        condition: service_healthy
    networks:
      - omniintel-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

networks:
  omniintel-net:
    driver: bridge
    name: omniintel-network

volumes:
  omniintel-data:
    driver: local
    name: omniintel-vector-data
  omniintel-checkpoints:
    driver: local
    name: omniintel-model-checkpoints
